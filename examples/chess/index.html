<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chess — built with the UX Laws skill</title>
<meta name="description" content="Playable chess built by an agent with the ux-laws skill loaded.">
<style>
  :root {
    --bg: #f6f7f9;
    --surface: #ffffff;
    --line: #e3e6ea;
    --text: #14171a;
    --muted: #666e78;
    --accent: #2f6df6;
    --accent-soft: #e7efff;
    /* The board does not follow the theme. A chess board looks like a chess
       board in daylight and at night; inverting it in dark mode was what made
       the pieces disappear. Only the page chrome around it changes. */
    --sq-light: #f0d9b5;
    --sq-dark: #b58863;
    --sq-edge: rgba(60,42,28,.55);
    --piece-w: #ffffff;
    --piece-b: #2a2724;
    --mark: rgba(255, 206, 61, .55);
    --mark-strong: rgba(255, 196, 0, .72);
    --hint: rgba(20, 16, 10, .6);   /* .32 measured 1.77:1 on dark squares; .6 clears 3:1 on both */
    --danger: #d1495b;
    --win: #16a34a;
    --radius: 14px;
    --shadow: 0 1px 2px rgba(16,20,26,.06), 0 8px 24px rgba(16,20,26,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115;
      --surface: #171a20;
      --line: #272b33;
      --text: #eef1f5;
      --muted: #98a1ad;
      --accent: #5b8cff;
      --accent-soft: #1b2740;
      --danger: #ff7d8f;
      --win: #4ade80;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100dvh;
    display: flex;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 ui-sans-serif, -apple-system, "Segoe UI", Roboto, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main { width: 100%; max-width: 460px; padding: 16px 16px 32px; display: flex; flex-direction: column; gap: 16px; }
  .side { display: flex; flex-direction: column; gap: 16px; }

  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  h1 { font-size: 15px; font-weight: 600; margin: 0; color: var(--muted); }

  .segmented { display: flex; gap: 4px; padding: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; }
  .segmented button {
    appearance: none; border: 0; background: transparent; color: var(--muted);
    font: inherit; font-size: 13px; font-weight: 500;
    padding: 8px 14px; border-radius: 999px; cursor: pointer;   /* Fitts's: real hit area */
  }
  .segmented button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
  .segmented button:hover:not([aria-pressed="true"]) { color: var(--text); }

  /* Uniform connectedness: status, board and controls share one surface. */
  .card {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: calc(var(--radius) + 6px); box-shadow: var(--shadow);
    padding: 16px; display: flex; flex-direction: column; gap: 14px;
  }

  /* Serial position: whose move it is comes first and largest. */
  .status { min-height: 50px; display: flex; flex-direction: column; justify-content: center; gap: 2px; }
  .status-line { font-size: 19px; font-weight: 650; letter-spacing: -.02em; display: flex; align-items: center; gap: 8px; }
  .status-sub { font-size: 13px; color: var(--muted); }
  .status-line.check { color: var(--danger); }
  .status-line.over { color: var(--win); }
  .turn-dot { width: 11px; height: 11px; border-radius: 50%; border: 1px solid var(--muted); flex: none; }
  .turn-dot.w { background: #fff; }
  .turn-dot.b { background: #1a1d22; }

  /* Miller's: coordinates are printed, so nobody has to count files in their head. */
  .board-wrap { display: grid; grid-template-columns: 14px 1fr; grid-template-rows: 1fr 14px; gap: 4px; }
  .ranks, .files { display: grid; font-size: 10px; color: var(--muted); }
  .ranks { grid-template-rows: repeat(8, 1fr); align-items: center; justify-items: center; }
  .files { grid-template-columns: repeat(8, 1fr); justify-items: center; grid-column: 2; }

  .board {
    position: relative;
    container-type: inline-size;
    display: grid; grid-template-columns: repeat(8, 1fr);
    border-radius: 6px; overflow: hidden;
    border: 1px solid var(--sq-edge);
    box-shadow: 0 2px 10px rgba(0,0,0,.18);
  }
  /* Fitts's: the board takes the full width available, so squares stay
     comfortably tappable (~48px on a phone) instead of decorative. */
  .sq {
    aspect-ratio: 1; position: relative; display: flex; align-items: center; justify-content: center;
    border: 0; padding: 0; cursor: pointer;
    font-size: clamp(27px, 8.7vw, 38px); line-height: 1;
    transition: background .1s ease;
  }
  .sq.l { background: var(--sq-light); }
  .sq.d { background: var(--sq-dark); }
  /* Highlights are translucent washes over the square, not replacement colours,
     so a marked square still reads as light or dark and the board never breaks
     its pattern. */
  .sq::before { content: ""; position: absolute; inset: 0; pointer-events: none; }
  .sq.last::before { background: var(--mark); }
  .sq.sel::before  { background: var(--mark-strong); }
  .sq.check::before {
    background: radial-gradient(circle at center,
      rgba(255,64,64,.95) 0%, rgba(255,64,64,.72) 38%, rgba(255,64,64,0) 72%);
  }
  .sq:focus-visible { outline: 3px solid var(--accent); outline-offset: -3px; z-index: 3; }
  .sq:disabled { cursor: default; }
  .piece { pointer-events: none; position: relative; z-index: 2; }
  /* Both piece colours are readable on both square colours — verified, not
     eyeballed: every combination clears 4.5:1. */
  .piece.w {
    color: var(--piece-w);
    -webkit-text-stroke: 1.6px #2a2724;   /* the edge carries the contrast: 10.8:1 on light squares */
    paint-order: stroke fill;
    text-shadow: 0 1px 2px rgba(0,0,0,.4);
  }
  .piece.b {
    color: var(--piece-b);
    -webkit-text-stroke: .6px #171512;
    paint-order: stroke fill;
    text-shadow: 0 1px 1px rgba(255,255,255,.18);
  }

  /* Postel's, the prevention half: legal destinations are shown, illegal ones
     are simply not offered — so an illegal move is unreachable, not rejected. */
  .dot { position: absolute; width: 28%; height: 28%; border-radius: 50%; background: var(--hint); pointer-events: none; z-index: 2; }
  .ring { position: absolute; inset: 5%; border-radius: 50%; border: 4px solid var(--hint); pointer-events: none; z-index: 2; }

  .controls { display: flex; gap: 8px; }
  button.action {
    flex: 1; appearance: none; font: inherit; font-size: 15px; font-weight: 550;
    padding: 12px 14px; border-radius: var(--radius); cursor: pointer;
    background: var(--surface); color: var(--text); border: 1px solid var(--line);
    transition: border-color .12s ease, color .12s ease;
  }
  button.action:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  button.action:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  button.action:disabled { opacity: .45; cursor: default; }
  /* Von Restorff: the one filled button appears only when the game is over. */
  button.action.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.action.primary:hover { filter: brightness(1.06); color: #fff; }

  /* Occam's: promotion is four choices that exist for a fraction of a second
     per game — so they appear only at that moment, never before. */
  .promo { display: none; flex-direction: column; gap: 8px; padding: 12px; background: var(--accent-soft); border-radius: var(--radius); }
  .promo.show { display: flex; }
  .promo-label { font-size: 13px; font-weight: 600; }
  .promo-row { display: flex; gap: 8px; }
  .promo-row button {
    flex: 1; font: inherit; font-size: 28px; line-height: 1; padding: 10px 0;
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px; cursor: pointer;
  }
  /* Hick's + sensible default: queen is the answer >95% of the time, so it
     leads and is visually heavier. The other three stay available, not equal. */
  .promo-row button.first { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft) inset; }
  .promo-row button:hover { border-color: var(--accent); }

  .meta { display: flex; gap: 8px; }
  .meta div { flex: 1; padding: 9px 8px; text-align: center; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
  .meta .value { font-size: 15px; font-weight: 650; letter-spacing: -.01em; min-height: 23px; }
  .meta .label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }

  /* Miller's again: the move list is the interface remembering the game so
     the player doesn't have to. Chunked in numbered pairs, newest visible. */
  .moves { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); max-height: 132px; overflow-y: auto; }
  .moves-empty { padding: 12px; font-size: 13px; color: var(--muted); text-align: center; }
  .moves table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
  .moves td { padding: 5px 8px; }
  .moves td.n { color: var(--muted); width: 34px; }
  .moves td.m { font-weight: 500; }
  .moves tr:nth-child(even) { background: rgba(127,127,127,.05); }
  .moves .cur { color: var(--accent); font-weight: 650; }

  /* Review marks: what you played (red) against what the engine wanted
     (green), on the same wash layer as the other highlights. */
  .sq.mv-bad::before  { background: rgba(214, 64, 64, .58); }
  .sq.mv-good::before { background: rgba(58, 170, 96, .58); }

  /* The piece travels instead of teleporting: a move you can see happening is
     a move you can follow. Distance and direction are the information. */
  .flyer {
    position: absolute; z-index: 5; pointer-events: none;
    display: flex; align-items: center; justify-content: center;
    font-size: clamp(27px, 8.7vw, 38px); line-height: 1;
    transition: transform .3s cubic-bezier(.22,.7,.24,1);
  }

  .walk { display: none; flex-direction: column; gap: 10px; }
  .walk.show { display: flex; }
  /* Never audio-only: everything spoken is also written here, so the
     walkthrough works with the sound off, on a muted phone, or for someone
     who simply doesn't want a voice. */
  .walk-caption {
    min-height: 46px; font-size: 14px; line-height: 1.5; padding: 11px 12px;
    border-radius: var(--radius); background: var(--accent-soft); color: var(--text);
  }
  .walk-caption b { font-weight: 650; }
  .walk-caption.quiet { background: var(--surface); border: 1px solid var(--line); color: var(--muted); }
  .walk-controls { display: flex; gap: 8px; align-items: center; }
  .walk-controls .action { padding: 11px 12px; font-size: 14px; }
  .walk-pos { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; margin-left: auto; }

  .review { display: none; flex-direction: column; gap: 12px; }
  .review.show { display: flex; }
  .review-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .score { display: flex; align-items: baseline; gap: 8px; }
  .score .num { font-size: 30px; font-weight: 700; letter-spacing: -.03em; }
  .score .of { font-size: 13px; color: var(--muted); }
  .score .who { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }

  /* Zeigarnik: a review of a long game takes seconds, so it says where it is
     rather than freezing on a spinner. */
  .bar { height: 6px; border-radius: 999px; background: var(--line); overflow: hidden; }
  .bar span { display: block; height: 100%; background: var(--accent); width: 0; transition: width .15s linear; }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-size: 12px; padding: 5px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
  .chip b { color: var(--text); font-weight: 650; }
  .chip.blunder b { color: #d64040; }
  .chip.mistake b { color: #d98324; }
  .chip.inacc b   { color: #c9a227; }
  .chip.best b    { color: #3aaa60; }

  /* Serial position: the one sentence worth remembering goes first. */
  .lesson { font-size: 14px; line-height: 1.55; padding: 12px; border-radius: var(--radius); background: var(--accent-soft); color: var(--text); }
  .lesson b { font-weight: 650; }

  .moments { display: flex; flex-direction: column; gap: 6px; }
  .moments h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0; font-weight: 600; }
  /* Fitts's + target distance: each moment is one wide tap that takes the
     board to that position — the lesson is the board, not the sentence. */
  .moment {
    display: flex; align-items: flex-start; gap: 10px; width: 100%; text-align: left;
    font: inherit; font-size: 13px; padding: 11px 12px; cursor: pointer;
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    color: var(--text);
  }
  .moment:hover { border-color: var(--accent); }
  .moment:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .moment[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
  .moment .tag { font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 6px; flex: none; margin-top: 1px; }
  .moment .tag.blunder { background: rgba(214,64,64,.16); color: #d64040; }
  .moment .tag.mistake { background: rgba(217,131,36,.16); color: #d98324; }
  .moment .tag.inacc   { background: rgba(201,162,39,.16); color: #c9a227; }
  .moment .txt { flex: 1; }
  .moment .txt b { font-weight: 650; }
  .moment .txt em { font-style: normal; color: var(--muted); display: block; margin-top: 2px; font-size: 12px; }
  .review-note { font-size: 11px; color: var(--muted); line-height: 1.5; margin: 0; }

  .hint { font-size: 12px; color: var(--muted); text-align: center; margin: 0; }
  .credit { text-align: center; display: flex; flex-direction: column; gap: 8px; }
  .credit p { margin: 0; font-size: 13px; color: var(--muted); }
  .credit a { color: var(--accent); text-decoration: none; }
  .credit a:hover { text-decoration: underline; }
  .credit code {
    display: inline-block; font-size: 12px; padding: 7px 11px; border-radius: 8px;
    background: var(--surface); border: 1px solid var(--line); color: var(--text);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  /* Fitts's: 40px round target, not a 16px speaker glyph. */
  .icon-btn {
    width: 40px; height: 40px; flex: none;
    display: flex; align-items: center; justify-content: center;
    border-radius: 999px; background: var(--surface); border: 1px solid var(--line);
    color: var(--muted); cursor: pointer;
    transition: color .12s ease, border-color .12s ease;
  }
  .icon-btn:hover { color: var(--text); border-color: var(--accent); }
  .icon-btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .icon-btn[aria-pressed="true"] { color: var(--accent); }
  .icon-btn .slash { display: none; }
  .icon-btn[aria-pressed="false"] .waves { display: none; }
  .icon-btn[aria-pressed="false"] .slash { display: inline; }
  .header-right { display: flex; align-items: center; gap: 8px; }

  /* Sized against the board rather than the viewport: a piece is always the
     same fraction of its square whether the board is 340px or 590px. */
  @supports (font-size: 1cqw) {
    .sq, .flyer { font-size: 9cqw; }
  }

  /* Desktop is not a big phone. The board takes the space it deserves — bigger
     targets, Fitts's — and the record of the game moves beside it instead of
     below the fold. Board left, panel right is what every chess site does. */
  @media (min-width: 900px) {
    body { align-items: flex-start; }
    main {
      max-width: 1040px; padding: 24px 24px 40px;
      display: grid; justify-content: center;
      grid-template-columns: minmax(340px, 600px) minmax(300px, 360px);
      grid-template-areas: "hd sd" "bd sd";
      column-gap: 24px; row-gap: 16px; align-items: start;
    }
    header { grid-area: hd; }
    #board-card { grid-area: bd; }
    .side { grid-area: sd; }
    .moves { max-height: 320px; }
    .hint { text-align: left; }
    .credit { text-align: left; align-items: flex-start; }
  }

  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>Chess</h1>
    <div class="header-right">
      <div class="segmented" role="group" aria-label="Opponent">
        <button id="mode-cpu" aria-pressed="true">Computer</button>
        <button id="mode-two" aria-pressed="false">2 players</button>
      </div>
      <!-- Hick's: one switch, not a volume mixer. Jakob's: a speaker icon in
           the header is where every board app already puts this. -->
      <button class="icon-btn" id="sound" aria-pressed="true" aria-label="Sound on">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="4 9 8 9 13 5 13 19 8 15 4 15"></polygon>
          <g class="waves"><path d="M16.5 9a4.5 4.5 0 0 1 0 6"></path><path d="M19.5 6.5a8 8 0 0 1 0 11"></path></g>
          <g class="slash"><path d="M17 9.5l5 5"></path><path d="M22 9.5l-5 5"></path></g>
        </svg>
      </button>
    </div>
  </header>

  <div class="card" id="board-card">
    <div class="status">
      <div class="status-line" id="status"><span class="turn-dot w"></span>Your move</div>
      <div class="status-sub" id="status-sub">You're White. Tap a piece to see where it can go.</div>
    </div>

    <div class="board-wrap">
      <div class="ranks" id="ranks"></div>
      <div class="board" id="board" role="grid" aria-label="Chess board"></div>
      <div class="files" id="files"></div>
    </div>

    <div class="promo" id="promo">
      <div class="promo-label" id="promo-label">Promote to</div>
      <div class="promo-row" id="promo-row"></div>
    </div>

    <div class="controls">
      <button class="action" id="review" style="display:none">Review game</button>
      <button class="action" id="undo" disabled>Take back</button>
      <button class="action" id="restart">New game</button>
    </div>

    <div class="segmented" id="difficulty" role="group" aria-label="Difficulty" style="align-self:center">
      <button id="diff-casual" aria-pressed="true">Casual</button>
      <button id="diff-strong" aria-pressed="false">Stronger</button>
    </div>
  </div>

  <aside class="side">
  <div class="meta">
    <div><div class="value" id="mat-w">—</div><div class="label" id="lab-w">White</div></div>
    <div><div class="value" id="mat-b">—</div><div class="label" id="lab-b">Black</div></div>
  </div>

  <div class="review card" id="review-panel">
    <div class="review-head">
      <div class="score">
        <span class="num" id="acc-num">—</span><span class="of">/ 100</span>
        <span class="who" id="acc-who">accuracy</span>
      </div>
      <button class="action" id="review-exit" style="display:none; flex:none; width:auto;">Final position</button>
    </div>
    <div class="bar" id="review-bar"><span id="review-fill"></span></div>
    <div class="lesson" id="lesson"></div>
    <div class="chips" id="chips"></div>
    <div class="moments" id="moments"></div>

    <button class="action" id="walk-start" style="display:none">Walk me through it</button>

    <div class="walk" id="walk">
      <div class="walk-caption" id="walk-caption"></div>
      <div class="walk-controls">
        <button class="action" id="walk-play">Pause</button>
        <button class="action" id="walk-next">Next</button>
        <button class="icon-btn" id="walk-voice" aria-pressed="true" aria-label="Narration on">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="4 9 8 9 13 5 13 19 8 15 4 15"></polygon>
            <g class="waves"><path d="M16.5 9a4.5 4.5 0 0 1 0 6"></path><path d="M19.5 6.5a8 8 0 0 1 0 11"></path></g>
            <g class="slash"><path d="M17 9.5l5 5"></path><path d="M22 9.5l-5 5"></path></g>
          </svg>
        </button>
        <button class="action" id="walk-exit" style="flex:none; width:auto;">Done</button>
        <span class="walk-pos" id="walk-pos"></span>
      </div>
    </div>

    <p class="review-note" id="review-note"></p>
  </div>

  <div class="moves" id="moves"><div class="moves-empty">Moves appear here as you play.</div></div>

  <p class="hint">Tap a piece, then a highlighted square · Arrow keys and Enter also work</p>
  <div class="sr-only" role="status" aria-live="polite" id="live"></div>

  <footer class="credit">
    <p>Built by an agent with the <a href="https://github.com/uwussimo/ux-laws">ux-laws</a> skill loaded.</p>
    <p><code>npx skills add uwussimo/ux-laws</code></p>
  </footer>
  </aside>
</main>

<script>
(() => {
  "use strict";
  const FILES = "abcdefgh";
  const GLYPH = { k:"♚", q:"♛", r:"♜", b:"♝", n:"♞", p:"♟" };
  const VAL = { p:100, n:320, b:330, r:500, q:900, k:0 };
  const DIAG = [[-1,-1],[-1,1],[1,-1],[1,1]];
  const ORTH = [[-1,0],[1,0],[0,-1],[0,1]];
  const KNIGHT = [[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]];
  const idx = (r,f) => r * 8 + f;
  const rank = i => Math.floor(i / 8);
  const file = i => i % 8;
  const sqName = i => FILES[file(i)] + (8 - rank(i));
  const isW = p => p === p.toUpperCase();
  const colorOf = p => (p ? (isW(p) ? "w" : "b") : null);
  const other = c => (c === "w" ? "b" : "w");

  function initial() {
    const b = Array(64).fill(null);
    const back = "rnbqkbnr";
    for (let f = 0; f < 8; f++) {
      b[idx(0,f)] = back[f];
      b[idx(1,f)] = "p";
      b[idx(6,f)] = "P";
      b[idx(7,f)] = back[f].toUpperCase();
    }
    return { b, turn:"w", castle:{K:true,Q:true,k:true,q:true}, ep:null, half:0, full:1 };
  }

  function kingSq(b, c) {
    const k = c === "w" ? "K" : "k";
    for (let i = 0; i < 64; i++) if (b[i] === k) return i;
    return -1;
  }

  function attacked(b, sq, by) {
    if (sq < 0) return false;
    const r0 = rank(sq), f0 = file(sq);
    const pd = by === "w" ? 1 : -1;
    for (const df of [-1,1]) {
      const r = r0 + pd, f = f0 + df;
      if (r>=0 && r<8 && f>=0 && f<8) {
        const p = b[idx(r,f)];
        if (p && colorOf(p) === by && p.toLowerCase() === "p") return true;
      }
    }
    for (const [dr,df] of KNIGHT) {
      const r = r0+dr, f = f0+df;
      if (r<0||r>7||f<0||f>7) continue;
      const p = b[idx(r,f)];
      if (p && colorOf(p) === by && p.toLowerCase() === "n") return true;
    }
    for (const [dr,df] of DIAG.concat(ORTH)) {
      const r = r0+dr, f = f0+df;
      if (r<0||r>7||f<0||f>7) continue;
      const p = b[idx(r,f)];
      if (p && colorOf(p) === by && p.toLowerCase() === "k") return true;
    }
    const slide = (dirs, types) => {
      for (const [dr,df] of dirs) {
        let r = r0+dr, f = f0+df;
        while (r>=0 && r<8 && f>=0 && f<8) {
          const p = b[idx(r,f)];
          if (p) {
            if (colorOf(p) === by && types.includes(p.toLowerCase())) return true;
            break;
          }
          r += dr; f += df;
        }
      }
      return false;
    };
    return slide(DIAG, ["b","q"]) || slide(ORTH, ["r","q"]);
  }

  function addPawn(out, from, to, p, cap, tr) {
    const last = isW(p) ? 0 : 7;
    if (tr === last) for (const pr of ["q","r","b","n"]) out.push({ from, to, piece:p, captured:cap, promo:pr });
    else out.push({ from, to, piece:p, captured:cap });
  }

  function pseudo(s) {
    const out = [];
    const me = s.turn, dir = me === "w" ? -1 : 1;
    for (let r = 0; r < 8; r++) for (let f = 0; f < 8; f++) {
      const from = idx(r,f), p = s.b[from];
      if (!p || colorOf(p) !== me) continue;
      const t = p.toLowerCase();
      const push = (tr, tf) => {
        if (tr<0||tr>7||tf<0||tf>7) return false;
        const to = idx(tr,tf), q = s.b[to];
        if (q && colorOf(q) === me) return false;
        out.push({ from, to, piece:p, captured:q || null });
        return !q;
      };
      if (t === "p") {
        const one = r + dir;
        if (one >= 0 && one < 8 && !s.b[idx(one,f)]) {
          addPawn(out, from, idx(one,f), p, null, one);
          const start = me === "w" ? 6 : 1;
          const two = r + 2*dir;
          if (r === start && !s.b[idx(two,f)]) out.push({ from, to: idx(two,f), piece:p, captured:null, dbl:true });
        }
        for (const df of [-1,1]) {
          const tr = one, tf = f + df;
          if (tr<0||tr>7||tf<0||tf>7) continue;
          const to = idx(tr,tf), q = s.b[to];
          if (q && colorOf(q) !== me) addPawn(out, from, to, p, q, tr);
          else if (!q && s.ep === to) out.push({ from, to, piece:p, captured: me === "w" ? "p" : "P", ep:true });
        }
      } else if (t === "n") {
        for (const [dr,df] of KNIGHT) push(r+dr, f+df);
      } else if (t === "k") {
        for (const [dr,df] of DIAG.concat(ORTH)) push(r+dr, f+df);
      } else {
        const dirs = t === "b" ? DIAG : t === "r" ? ORTH : DIAG.concat(ORTH);
        for (const [dr,df] of dirs) {
          let tr = r+dr, tf = f+df;
          while (push(tr,tf)) { tr += dr; tf += df; }
        }
      }
    }
    // Castling — generated only when every rule already holds, so the player
    // never sees an offer that would be rejected.
    const opp = other(me), hr = me === "w" ? 7 : 0;
    const kSq = idx(hr,4);
    if (s.b[kSq] === (me === "w" ? "K" : "k")) {
      const kRight = me === "w" ? s.castle.K : s.castle.k;
      const qRight = me === "w" ? s.castle.Q : s.castle.q;
      const rookK = s.b[idx(hr,7)], rookQ = s.b[idx(hr,0)];
      const wantRook = me === "w" ? "R" : "r";
      if (kRight && rookK === wantRook && !s.b[idx(hr,5)] && !s.b[idx(hr,6)]
          && !attacked(s.b, kSq, opp) && !attacked(s.b, idx(hr,5), opp) && !attacked(s.b, idx(hr,6), opp))
        out.push({ from:kSq, to:idx(hr,6), piece:s.b[kSq], captured:null, castle:"k" });
      if (qRight && rookQ === wantRook && !s.b[idx(hr,1)] && !s.b[idx(hr,2)] && !s.b[idx(hr,3)]
          && !attacked(s.b, kSq, opp) && !attacked(s.b, idx(hr,3), opp) && !attacked(s.b, idx(hr,2), opp))
        out.push({ from:kSq, to:idx(hr,2), piece:s.b[kSq], captured:null, castle:"q" });
    }
    return out;
  }

  function make(s, m) {
    const b = s.b.slice();
    const castle = { ...s.castle };
    b[m.from] = null;
    b[m.to] = m.promo ? (isW(m.piece) ? m.promo.toUpperCase() : m.promo) : m.piece;
    if (m.ep) b[isW(m.piece) ? m.to + 8 : m.to - 8] = null;
    if (m.castle) {
      const hr = rank(m.to);
      if (m.castle === "k") { b[idx(hr,5)] = b[idx(hr,7)]; b[idx(hr,7)] = null; }
      else { b[idx(hr,3)] = b[idx(hr,0)]; b[idx(hr,0)] = null; }
    }
    const t = m.piece.toLowerCase();
    if (t === "k") { if (isW(m.piece)) { castle.K = castle.Q = false; } else { castle.k = castle.q = false; } }
    if (m.from === 63 || m.to === 63) castle.K = false;
    if (m.from === 56 || m.to === 56) castle.Q = false;
    if (m.from === 7  || m.to === 7 ) castle.k = false;
    if (m.from === 0  || m.to === 0 ) castle.q = false;
    return {
      b, turn: other(s.turn), castle,
      ep: m.dbl ? (m.from + m.to) / 2 : null,
      half: (t === "p" || m.captured) ? 0 : s.half + 1,
      full: s.turn === "b" ? s.full + 1 : s.full
    };
  }

  function legal(s) {
    const out = [];
    for (const m of pseudo(s)) {
      const n = make(s, m);
      if (!attacked(n.b, kingSq(n.b, s.turn), n.turn)) out.push(m);
    }
    return out;
  }

  const inCheck = s => attacked(s.b, kingSq(s.b, s.turn), other(s.turn));

  function insufficient(b) {
    const pieces = b.filter(Boolean).map(p => p.toLowerCase());
    if (pieces.some(p => p === "p" || p === "r" || p === "q")) return false;
    const minors = pieces.filter(p => p === "n" || p === "b").length;
    return minors <= 1;
  }

  function san(s, m, list) {
    if (m.castle) return m.castle === "k" ? "O-O" : "O-O-O";
    const t = m.piece.toLowerCase();
    let out = "";
    if (t === "p") {
      if (m.captured) out += FILES[file(m.from)] + "x";
      out += sqName(m.to);
      if (m.promo) out += "=" + m.promo.toUpperCase();
    } else {
      out += t.toUpperCase();
      const rivals = list.filter(x => x !== m && x.piece === m.piece && x.to === m.to && x.from !== m.from);
      if (rivals.length) {
        if (!rivals.some(x => file(x.from) === file(m.from))) out += FILES[file(m.from)];
        else if (!rivals.some(x => rank(x.from) === rank(m.from))) out += String(8 - rank(m.from));
        else out += sqName(m.from);
      }
      if (m.captured) out += "x";
      out += sqName(m.to);
    }
    const n = make(s, m);
    if (inCheck(n)) out += legal(n).length ? "+" : "#";
    return out;
  }

  // --- engine -------------------------------------------------------------
  const CENTER = [0,1,2,3,3,2,1,0];
  const pst = (p, i) => {
    const t = p.toLowerCase();
    const c = CENTER[file(i)] + CENTER[rank(i)];
    if (t === "n" || t === "b") return c * 4;
    if (t === "p") { const adv = isW(p) ? 6 - rank(i) : rank(i) - 1; return c * 2 + adv * 4; }
    return 0;
  };
  function evaluate(s) {
    let sc = 0;
    for (let i = 0; i < 64; i++) {
      const p = s.b[i];
      if (!p) continue;
      const v = VAL[p.toLowerCase()] + pst(p, i);
      sc += isW(p) ? v : -v;
    }
    return sc;
  }
  function search(s, depth, alpha, beta) {
    const moves = legal(s);
    if (!moves.length) return inCheck(s) ? -90000 - depth : 0;
    if (depth === 0) return s.turn === "w" ? evaluate(s) : -evaluate(s);
    moves.sort((a,b) => (b.captured ? VAL[b.captured.toLowerCase()] : 0) - (a.captured ? VAL[a.captured.toLowerCase()] : 0));
    let best = -Infinity;
    for (const m of moves) {
      const sc = -search(make(s, m), depth - 1, -beta, -alpha);
      if (sc > best) best = sc;
      if (best > alpha) alpha = best;
      if (alpha >= beta) break;
    }
    return best;
  }
  function bestMove(s, depth) {
    const moves = legal(s);
    if (!moves.length) return null;
    let best = -Infinity, pick = [];
    for (const m of moves) {
      const sc = -search(make(s, m), depth - 1, -Infinity, Infinity);
      if (sc > best + 0.001) { best = sc; pick = [m]; }
      else if (Math.abs(sc - best) < 0.001) pick.push(m);
    }
    return pick[Math.floor(Math.random() * pick.length)];
  }

  // --- review -------------------------------------------------------------
  // A number of centipawns means nothing to a human. What matters is how much
  // the move changed your chances of winning, so every judgement below is made
  // in win-probability points, not material.
  const winPct = cp => 50 + 50 * (2 / (1 + Math.exp(-0.00368208 * Math.max(-1500, Math.min(1500, cp)))) - 1);
  const moveAccuracy = drop => Math.max(0, Math.min(100, 103.1668 * Math.exp(-0.04354 * drop) - 3.1669));
  const gradeOf = drop => drop >= 20 ? "blunder" : drop >= 10 ? "mistake" : drop >= 5 ? "inacc" : drop >= 2 ? "good" : "best";
  const GRADE_LABEL = { blunder:"Blunder", mistake:"Mistake", inacc:"Inaccuracy", good:"Good", best:"Best" };
  const PIECE_WORD = { p:"pawn", n:"knight", b:"bishop", r:"rook", q:"queen", k:"king" };

  // One search per position yields both numbers we need: what the best move was
  // worth, and what the move actually played was worth.
  function judge(state, played, depth) {
    const moves = legal(state);
    if (!moves.length) return null;
    let bestVal = -Infinity, bestMv = null, bestTie = -Infinity, playedVal = null;
    for (const mv of moves) {
      const val = -search(make(state, mv), depth - 1, -Infinity, Infinity);
      // Many moves tie at this depth. Advice like "a4 was better" is true and
      // useless, so ties break toward the move a person would actually be told
      // to play: take material, or develop toward the middle.
      const t = mv.piece.toLowerCase();
      const homeRank = isW(mv.piece) ? 7 : 0;
      const tie = (mv.captured ? VAL[mv.captured.toLowerCase()] * 10 : 0)
        + pst(mv.piece, mv.to) - pst(mv.piece, mv.from)
        + CENTER[file(mv.to)] * 3
        + ((t === "n" || t === "b") && rank(mv.from) === homeRank ? 6 : 0);
      if (val > bestVal) { bestVal = val; bestMv = mv; bestTie = tie; }
      else if (val === bestVal && tie > bestTie) { bestMv = mv; bestTie = tie; }
      if (mv.from === played.from && mv.to === played.to && (mv.promo || null) === (played.promo || null)) playedVal = val;
    }
    if (playedVal === null) playedVal = bestVal;
    return { bestVal, playedVal, bestMv, moves };
  }

  // Say what actually happened in pieces, not in evaluation points. The engine
  // is only trusted for claims it can demonstrate: a reply that wins material,
  // or a capture that was available and skipped.
  function explain(state, played, best, depth) {
    const after = make(state, played);
    const reply = bestMove(after, Math.max(2, depth - 1));
    if (reply && reply.captured) {
      const gain = VAL[reply.captured.toLowerCase()];
      const defended = attacked(make(after, reply).b, reply.to, state.turn);
      if (gain >= 300 || (gain >= 100 && !defended)) {
        const word = PIECE_WORD[reply.captured.toLowerCase()];
        return `${defended ? "It trades off" : "It leaves"} your ${word} on ${sqName(reply.to)}${defended ? "" : " undefended"} — ${san(after, reply, legal(after))} takes it.`;
      }
    }
    if (best && best.captured && (!played.captured || VAL[best.captured.toLowerCase()] > VAL[played.captured.toLowerCase()])) {
      return `There was a free ${PIECE_WORD[best.captured.toLowerCase()]} on ${sqName(best.to)}.`;
    }
    const nAfter = make(state, played);
    if (inCheck(nAfter) === false && legal(nAfter).length && bestMove(nAfter, 2)) {
      const opp = bestMove(nAfter, 2);
      const nn = make(nAfter, opp);
      if (!legal(nn).length && inCheck(nn)) return `It allows mate: ${san(nAfter, opp, legal(nAfter))}.`;
    }
    return null;
  }

  // The headline is derived from the pattern in the mistakes, so it is a real
  // observation about this game rather than a fortune cookie.
  function lessonFrom(entries, accuracy, side) {
    const bad = entries.filter(e => e.grade === "blunder" || e.grade === "mistake");
    const hung = bad.filter(e => e.why && e.why.includes("undefended")).length;
    const missed = bad.filter(e => e.why && e.why.startsWith("There was a free")).length;
    const mated = entries.some(e => e.why && e.why.startsWith("It allows mate"));
    if (!bad.length) {
      return accuracy >= 90
        ? "<b>Clean game.</b> Nothing here cost you more than a fraction of a pawn — keep doing what you did."
        : "<b>No real mistakes.</b> The losses were slow ones rather than single bad moves.";
    }
    if (hung >= 2 || (hung === 1 && bad.length === 1))
      return `<b>Check what is attacked before you move.</b> ${hung === 1 ? "Your worst moment" : `${hung} of your ${bad.length} big mistakes`} left a piece hanging — one scan of your opponent's captures would have caught it.`;
    if (missed >= 2)
      return `<b>Look for captures first.</b> You walked past ${missed} free pieces. Before anything else, ask what you can take.`;
    if (mated)
      return "<b>Watch your king.</b> The game ended in a mate that was on the board a move early — when your king has few squares, count the escape squares before you attack.";
    return `<b>${bad.length} move${bad.length > 1 ? "s" : ""} decided this game.</b> The rest was reasonable; the swing came from a small number of moments below.`;
  }

  // --- narration ----------------------------------------------------------
  // The computer's own voice, via the Web Speech API. It is an enhancement,
  // never the channel: every word spoken is also printed as a caption, and the
  // walkthrough runs identically on a browser with no speech support at all.
  const Speech = (() => {
    const store = {
      get(k) { try { return localStorage.getItem(k); } catch { return null; } },
      set(k, v) { try { localStorage.setItem(k, v); } catch { /* ignore */ } }
    };
    const supported = typeof speechSynthesis !== "undefined" && typeof SpeechSynthesisUtterance !== "undefined";
    let on = supported && store.get("chess-voice") !== "off";
    return {
      supported,
      get on() { return on; },
      toggle() { on = !on; store.set("chess-voice", on ? "on" : "off"); if (!on) this.stop(); return on; },
      stop() { if (supported) try { speechSynthesis.cancel(); } catch { /* ignore */ } },
      // Resolves when the sentence has been said — or immediately when there is
      // no voice, so pacing never depends on speech being available.
      say(text) {
        return new Promise(resolve => {
          if (!on || !supported || !text) return resolve();
          try {
            speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(text);
            u.lang = "en-US"; u.rate = 1.03; u.pitch = 1;
            let done = false;
            const finish = () => { if (!done) { done = true; resolve(); } };
            u.onend = finish; u.onerror = finish;
            // Some browsers drop long utterances silently; never hang the walk.
            setTimeout(finish, Math.min(15000, 1200 + text.length * 70));
            speechSynthesis.speak(u);
          } catch { resolve(); }
        });
      }
    };
  })();

  const raf = typeof requestAnimationFrame === "function" ? requestAnimationFrame : cb => setTimeout(cb, 16);
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const reducedMotion = () => {
    try { return window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches; }
    catch { return false; }
  };

  // --- sound --------------------------------------------------------------
  // Every sound answers a question the screen answers slower: did that land,
  // was something taken, am I in trouble. Nothing here is decorative, and
  // nothing plays that the board doesn't already show.
  const Sound = (() => {
    let ctx = null, master = null;
    // Postel's: a blocked or missing localStorage must not break the game.
    const store = {
      get(k) { try { return localStorage.getItem(k); } catch { return null; } },
      set(k, v) { try { localStorage.setItem(k, v); } catch { /* ignore */ } }
    };
    let on = store.get("chess-sound") !== "off";

    // Built lazily inside a real click, because browsers refuse audio before
    // a gesture — and never built at all while muted.
    function ac() {
      if (!on) return null;
      if (!ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        try { ctx = new AC(); } catch { return null; }
        master = ctx.createGain();
        master.gain.value = 0.3;
        master.connect(ctx.destination);
      }
      if (ctx.state === "suspended") ctx.resume();
      return ctx;
    }

    function tone(freq, { dur = 0.09, gain = 0.35, type = "triangle", delay = 0 } = {}) {
      const c = ac(); if (!c) return;
      const t0 = c.currentTime + delay;
      const osc = c.createOscillator(), g = c.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, t0);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(gain, t0 + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(g); g.connect(master);
      osc.start(t0); osc.stop(t0 + dur + 0.03);
    }

    // A piece landing on a board is a short broadband knock, not a beep.
    function knock({ dur = 0.06, gain = 0.5, cutoff = 1500, delay = 0 } = {}) {
      const c = ac(); if (!c) return;
      const t0 = c.currentTime + delay;
      const n = Math.max(1, Math.floor(c.sampleRate * dur));
      const buf = c.createBuffer(1, n, c.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 3);
      const src = c.createBufferSource(); src.buffer = buf;
      const filt = c.createBiquadFilter(); filt.type = "lowpass"; filt.frequency.value = cutoff;
      const g = c.createGain(); g.gain.value = gain;
      src.connect(filt); filt.connect(g); g.connect(master);
      src.start(t0);
    }

    return {
      get on() { return on; },
      toggle() {
        on = !on;
        store.set("chess-sound", on ? "on" : "off");
        if (on) knock({ dur: 0.04, gain: 0.3, cutoff: 2000 });   // confirm the switch with the switch
        return on;
      },
      select() { knock({ dur: 0.025, gain: 0.16, cutoff: 2400 }); },
      move()   { knock({ dur: 0.06,  gain: 0.5,  cutoff: 1500 }); },
      // Von Restorff, in audio: a capture is heavier and darker than a quiet
      // move, so losing a piece never sounds like nothing happened.
      capture() { knock({ dur: 0.1, gain: 0.75, cutoff: 700 }); tone(150, { dur: 0.09, gain: 0.28, type: "sine" }); },
      castle()  { knock({ dur: 0.05, gain: 0.45, cutoff: 1500 }); knock({ dur: 0.05, gain: 0.45, cutoff: 1500, delay: 0.1 }); },
      promote() { tone(660, { dur: 0.08 }); tone(880, { dur: 0.08, delay: 0.08 }); tone(1320, { dur: 0.12, delay: 0.16 }); },
      // Check is the one thing you must not miss, so it is the one sound that
      // is unmistakably not a move.
      check()   { tone(880, { dur: 0.07, gain: 0.3 }); tone(1174, { dur: 0.1, gain: 0.3, delay: 0.09 }); },
      win()     { [523, 659, 784].forEach((f, i) => tone(f, { dur: 0.16, gain: 0.3, delay: i * 0.11 })); },
      lose()    { [392, 330, 262].forEach((f, i) => tone(f, { dur: 0.2, gain: 0.28, delay: i * 0.13 })); },
      draw()    { tone(440, { dur: 0.18, gain: 0.26 }); tone(392, { dur: 0.22, gain: 0.26, delay: 0.14 }); },
      back()    { knock({ dur: 0.04, gain: 0.3, cutoff: 900 }); tone(300, { dur: 0.07, gain: 0.2, type: "sine", delay: 0.02 }); }
    };
  })();

  // --- ui -----------------------------------------------------------------
  const el = id => document.getElementById(id);
  const boardEl = el("board"), statusEl = el("status"), subEl = el("status-sub");
  const undoBtn = el("undo"), restartBtn = el("restart"), liveEl = el("live");
  const promoEl = el("promo"), promoRow = el("promo-row"), diffEl = el("difficulty");

  const ui = { s: initial(), sel: null, targets: [], history: [], sans: [], last: null,
               vsCpu: true, depth: 2, busy: false, over: null, pendingPromo: null,
               reviewing: false, review: null, viewIdx: null, viewState: null, viewMarks: null };

  const squares = Array.from({ length: 64 }, (_, i) => {
    const b = document.createElement("button");
    b.className = "sq " + ((rank(i) + file(i)) % 2 === 0 ? "l" : "d");
    b.dataset.i = i;
    b.setAttribute("role", "gridcell");
    b.addEventListener("click", () => tap(i));
    boardEl.appendChild(b);
    return b;
  });
  el("ranks").innerHTML = [8,7,6,5,4,3,2,1].map(n => `<span>${n}</span>`).join("");
  el("files").innerHTML = FILES.split("").map(f => `<span>${f}</span>`).join("");

  const pieceName = p => ({ k:"king", q:"queen", r:"rook", b:"bishop", n:"knight", p:"pawn" })[p.toLowerCase()];

  function myTurn() {
    return !ui.over && !ui.busy && !ui.reviewing && !ui.viewState && !ui.walk && (!ui.vsCpu || ui.s.turn === "w");
  }

  function tap(i) {
    if (!myTurn()) return;
    if (ui.pendingPromo) return;
    const p = ui.s.b[i];
    const move = ui.targets.find(m => m.to === i);
    if (move) {
      // Promotion is the one move that genuinely needs a decision, so it is
      // the one moment the picker exists.
      const promos = ui.targets.filter(m => m.to === i && m.promo);
      if (promos.length) { ui.pendingPromo = promos; showPromo(promos); return; }
      commit(move);
      return;
    }
    if (p && colorOf(p) === ui.s.turn) {
      ui.sel = ui.sel === i ? null : i;
      ui.targets = ui.sel === null ? [] : legal(ui.s).filter(m => m.from === i);
      if (ui.sel !== null) Sound.select();   // picking up speaks; putting down doesn't
    } else {
      ui.sel = null; ui.targets = [];   // tapping empty space deselects; no error
    }
    render();
  }

  function showPromo(promos) {
    promoRow.innerHTML = "";
    const order = ["q","r","b","n"];
    order.forEach((code, n) => {
      const m = promos.find(x => x.promo === code);
      if (!m) return;
      const btn = document.createElement("button");
      btn.className = n === 0 ? "first" : "";
      btn.innerHTML = `<span class="piece ${colorOf(m.piece)}">${GLYPH[code]}</span>`;
      btn.setAttribute("aria-label", pieceName(code));
      btn.addEventListener("click", () => { promoEl.classList.remove("show"); ui.pendingPromo = null; commit(m); });
      promoRow.appendChild(btn);
    });
    el("promo-label").textContent = "Promote to";
    promoEl.classList.add("show");
    promoRow.firstChild?.focus();
  }

  function commit(m) {
    const list = legal(ui.s);
    const text = san(ui.s, m, list);
    ui.history.push({ s: ui.s, last: ui.last, m });
    ui.sans.push(text);
    ui.last = { from: m.from, to: m.to };
    ui.s = make(ui.s, m);
    ui.sel = null; ui.targets = [];
    finishTurn(text, m);
  }

  // The sound names what happened, in the order it happened: the move lands,
  // then — only if there is news — check or the end of the game.
  function playMove(m, text) {
    if (m.castle) Sound.castle();
    else if (m.promo) Sound.promote();
    else if (m.captured) Sound.capture();
    else Sound.move();
    if (ui.over) {
      const won = ui.over.type === "mate" && (!ui.vsCpu || ui.over.winner === "w");
      const lost = ui.over.type === "mate" && ui.vsCpu && ui.over.winner === "b";
      setTimeout(() => (lost ? Sound.lose() : won ? Sound.win() : Sound.draw()), 190);
    } else if (text.endsWith("+")) {
      setTimeout(() => Sound.check(), 95);
    }
  }

  function finishTurn(text, m) {
    checkOver();
    playMove(m, text);
    render();
    liveEl.textContent = text + (ui.over ? ". " + statusEl.textContent : "");
    if (!ui.over && ui.vsCpu && ui.s.turn === "b") {
      ui.busy = true;
      render();
      // Doherty: the board updates instantly on your move; the reply comes
      // after a visible "Thinking…" rather than a frozen board.
      setTimeout(() => {
        const m = bestMove(ui.s, ui.depth);
        ui.busy = false;
        if (!m) { checkOver(); render(); return; }
        const t = san(ui.s, m, legal(ui.s));
        ui.history.push({ s: ui.s, last: ui.last, m });
        ui.sans.push(t);
        ui.last = { from: m.from, to: m.to };
        ui.s = make(ui.s, m);
        checkOver();
        playMove(m, t);
        render();
        liveEl.textContent = t + (ui.over ? ". " + statusEl.textContent : "");
      }, 260);
    }
  }

  function checkOver() {
    const moves = legal(ui.s);
    if (!moves.length) {
      ui.over = inCheck(ui.s) ? { type:"mate", winner: other(ui.s.turn) } : { type:"stalemate" };
    } else if (insufficient(ui.s.b)) ui.over = { type:"material" };
    else if (ui.s.half >= 100) ui.over = { type:"fifty" };
    else ui.over = null;
  }

  function material() {
    let w = 0, b = 0;
    for (const p of ui.s.b) {
      if (!p) continue;
      const v = VAL[p.toLowerCase()];
      if (isW(p)) w += v; else b += v;
    }
    return { w, b };
  }

  function render() {
    const view = ui.viewState || ui.s;
    const marks = ui.viewMarks;
    const checkSq = inCheck(view) ? kingSq(view.b, view.turn) : -1;
    squares.forEach((sq, i) => {
      const p = view.b[i];
      sq.classList.toggle("mv-bad", !!marks && marks.bad.includes(i));
      sq.classList.toggle("mv-good", !!marks && marks.good.includes(i));
      sq.classList.toggle("last", !marks && !!ui.last && (ui.last.from === i || ui.last.to === i));
      sq.classList.toggle("sel", !marks && ui.sel === i);
      sq.classList.toggle("check", i === checkSq && (!!marks || !ui.over));
      const target = marks ? null : ui.targets.find(m => m.to === i);
      sq.innerHTML = (p ? `<span class="piece ${colorOf(p)}">${GLYPH[p.toLowerCase()]}</span>` : "")
        + (target ? (p || target.ep ? '<span class="ring"></span>' : '<span class="dot"></span>') : "");
      sq.disabled = !myTurn();
      sq.setAttribute("aria-label", `${sqName(i)}${p ? `, ${colorOf(p) === "w" ? "white" : "black"} ${pieceName(p)}` : ", empty"}${target ? ", can move here" : ""}`);
      sq.setAttribute("aria-pressed", String(ui.sel === i));
    });

    const dot = c => `<span class="turn-dot ${c}"></span>`;
    statusEl.classList.remove("check", "over");
    if (ui.over) {
      statusEl.classList.add("over");
      if (ui.over.type === "mate") {
        const w = ui.over.winner;
        statusEl.textContent = ui.vsCpu ? (w === "w" ? "You win" : "Computer wins") : (w === "w" ? "White wins" : "Black wins");
        subEl.textContent = `Checkmate on move ${ui.s.full}. ${ui.sans[ui.sans.length-1] || ""}`;
      } else {
        statusEl.textContent = "Draw";
        subEl.textContent = ui.over.type === "stalemate" ? "Stalemate — no legal moves, but no check."
          : ui.over.type === "material" ? "Neither side has enough material to mate."
          : "Fifty moves without a capture or pawn move.";
      }
    } else if (ui.busy) {
      statusEl.innerHTML = dot("b") + "Computer’s move";
      subEl.textContent = "Thinking…";
    } else {
      const c = ui.s.turn;
      const label = ui.vsCpu ? "Your move" : (c === "w" ? "White to move" : "Black to move");
      statusEl.innerHTML = dot(c) + label;
      if (inCheck(ui.s)) { statusEl.classList.add("check"); statusEl.innerHTML = dot(c) + label + " — check"; }
      subEl.textContent = ui.sans.length
        ? `Last: ${ui.sans[ui.sans.length-1]}`
        : (ui.vsCpu ? "You're White. Tap a piece to see where it can go." : "White starts. Tap a piece to see where it can go.");
    }

    // Material shown as an advantage, not two raw totals — nobody should be
    // adding up pawns in their head to know if they are winning.
    const { w, b } = material();
    const diff = (w - b) / 100;
    el("mat-w").textContent = diff > 0 ? `+${diff}` : "—";
    el("mat-b").textContent = diff < 0 ? `+${-diff}` : "—";
    el("lab-w").textContent = ui.vsCpu ? "You" : "White";
    el("lab-b").textContent = ui.vsCpu ? "Computer" : "Black";

    const movesEl = el("moves");
    if (!ui.sans.length) movesEl.innerHTML = '<div class="moves-empty">Moves appear here as you play.</div>';
    else {
      let rows = "";
      for (let i = 0; i < ui.sans.length; i += 2) {
        const cur = i + 1 >= ui.sans.length - 1;
        rows += `<tr><td class="n">${i/2 + 1}.</td><td class="m${cur && ui.sans.length % 2 ? " cur" : ""}">${ui.sans[i]}</td>`
             +  `<td class="m${cur && ui.sans.length % 2 === 0 ? " cur" : ""}">${ui.sans[i+1] || ""}</td></tr>`;
      }
      movesEl.innerHTML = `<table>${rows}</table>`;
      movesEl.scrollTop = movesEl.scrollHeight;
    }

    const reviewBtn = el("review");
    const canReview = !!ui.over && ui.history.length >= 2;
    reviewBtn.style.display = canReview ? "" : "none";
    reviewBtn.disabled = ui.reviewing;
    reviewBtn.textContent = ui.reviewing ? "Reviewing…" : ui.review ? "Review again" : "Review game";
    // Peak-End: after a game the useful next step is understanding it, so the
    // review is the loud button — until you have used it, then Play again is.
    const reviewIsNext = canReview && !ui.review && !ui.reviewing;
    reviewBtn.classList.toggle("primary", reviewIsNext);
    undoBtn.disabled = !ui.history.length || ui.busy || ui.reviewing || !!ui.viewState;
    restartBtn.textContent = ui.over ? "Play again" : "New game";
    restartBtn.classList.toggle("primary", !!ui.over && !reviewIsNext);
    diffEl.style.display = ui.vsCpu ? "flex" : "none";
    if (!ui.pendingPromo) promoEl.classList.remove("show");
  }

  const REVIEW_DEPTH = 3;

  function runReview() {
    const sides = ui.vsCpu ? ["w"] : ["w", "b"];
    const jobs = [];
    ui.history.forEach((h, i) => { if (sides.includes(h.s.turn)) jobs.push({ i, h }); });
    if (!jobs.length) return;

    ui.reviewing = true;
    ui.review = { entries: [], done: 0, total: jobs.length, sides };
    el("review-panel").classList.add("show");
    el("review-exit").style.display = "none";
    el("acc-num").textContent = "—";
    el("moments").innerHTML = "";
    el("chips").innerHTML = "";
    el("lesson").innerHTML = "Looking at every move you played…";
    el("review-note").textContent = "";
    render();

    let k = 0;
    const step = () => {
      const t0 = Date.now();
      // Work in ~90ms slices: long enough to make progress, short enough that
      // the progress bar and the page stay responsive between them.
      while (k < jobs.length && Date.now() - t0 < 90) {
        const { i, h } = jobs[k++];
        const res = judge(h.s, h.m, REVIEW_DEPTH);
        if (res) {
          const drop = Math.max(0, winPct(res.bestVal) - winPct(res.playedVal));
          const grade = gradeOf(drop);
          const played = ui.sans[i];
          const bestSan = san(h.s, res.bestMv, res.moves);
          ui.review.entries.push({
            ply: i, side: h.s.turn, drop, grade, played, bestSan,
            accuracy: moveAccuracy(drop),
            why: (grade === "blunder" || grade === "mistake" || grade === "inacc")
              ? explain(h.s, h.m, res.bestMv, REVIEW_DEPTH) : null,
            state: h.s, playedMove: h.m, bestMove: res.bestMv
          });
        }
        ui.review.done = k;
      }
      el("review-fill").style.width = `${Math.round(100 * k / jobs.length)}%`;
      el("lesson").innerHTML = `Looking at every move you played… <b>${k} of ${jobs.length}</b>`;
      if (k < jobs.length) setTimeout(step, 0);
      else finishReview();
    };
    setTimeout(step, 0);
  }

  function finishReview() {
    ui.reviewing = false;
    const all = ui.review.entries;
    const mine = ui.vsCpu ? all.filter(e => e.side === "w") : all;
    const accuracy = mine.length ? mine.reduce((a, e) => a + e.accuracy, 0) / mine.length : 100;

    el("review-bar").style.display = "none";
    el("acc-num").textContent = accuracy.toFixed(1);
    el("acc-who").textContent = ui.vsCpu ? "your accuracy" : "both sides";
    el("lesson").innerHTML = lessonFrom(mine, accuracy, "w");

    const counts = {};
    for (const e of mine) counts[e.grade] = (counts[e.grade] || 0) + 1;
    el("chips").innerHTML = ["best","good","inacc","mistake","blunder"]
      .filter(g => counts[g])
      .map(g => `<span class="chip ${g}"><b>${counts[g]}</b> ${GRADE_LABEL[g]}${counts[g] > 1 && g !== "best" ? "s" : ""}</span>`)
      .join("");

    // Hick's: three moments, not forty. The worst ones, worst first.
    const key = mine.filter(e => e.grade === "blunder" || e.grade === "mistake" || e.grade === "inacc")
                    .sort((a, b) => b.drop - a.drop).slice(0, 3);
    const momentsEl = el("moments");
    if (!key.length) {
      momentsEl.innerHTML = '<h3>Key moments</h3><p class="review-note">Nothing cost you enough to single out.</p>';
    } else {
      momentsEl.innerHTML = "<h3>Key moments — tap to see the position</h3>";
      key.forEach(e => {
        const num = Math.floor(e.ply / 2) + 1;
        const btn = document.createElement("button");
        btn.className = "moment";
        btn.setAttribute("aria-pressed", "false");
        btn.innerHTML = `<span class="tag ${e.grade}">${GRADE_LABEL[e.grade]}</span>`
          + `<span class="txt"><b>${num}${e.side === "w" ? "." : "..."} ${e.played}</b> — ${e.bestSan} was better.`
          + `${e.why ? `<em>${e.why}</em>` : `<em>Worth about ${(Math.abs(e.drop) / 10).toFixed(1)} in winning chances.</em>`}</span>`;
        btn.addEventListener("click", () => showMoment(e, btn));
        momentsEl.appendChild(btn);
      });
    }
    el("walk-start").style.display = "";
    el("walk-start").textContent = "Walk me through it";
    el("review-note").textContent =
      `Reviewed with the built-in engine at depth ${REVIEW_DEPTH}. It reliably catches hung pieces, missed captures and mates; it is not a substitute for a real engine on quiet positional moves.`;
    render();
  }

  // Tap a moment and the board becomes the explanation: red is what you
  // played, green is what the engine wanted.
  function showMoment(entry, btn) {
    const pressed = btn.getAttribute("aria-pressed") === "true";
    Array.from(el("moments").children).forEach(c => c.setAttribute && c.setAttribute("aria-pressed", "false"));
    if (pressed) { exitView(); return; }
    btn.setAttribute("aria-pressed", "true");
    ui.viewState = entry.state;
    ui.viewMarks = { bad: [entry.playedMove.from, entry.playedMove.to], good: [entry.bestMove.from, entry.bestMove.to] };
    el("review-exit").style.display = "";
    render();
  }
  function exitView() {
    ui.viewState = null; ui.viewMarks = null;
    Array.from(el("moments").children).forEach(c => c.setAttribute && c.setAttribute("aria-pressed", "false"));
    el("review-exit").style.display = "none";
    render();
  }
  el("review-exit").addEventListener("click", exitView);
  el("review").addEventListener("click", runReview);

  // --- guided walkthrough -------------------------------------------------
  // Notation is written for the eye. Spoken aloud it has to become words:
  // "Bxc6" is "Bishop takes C 6", not "bee ex see six".
  const PIECE_SAID = { K:"King", Q:"Queen", R:"Rook", B:"Bishop", N:"Knight" };
  function spell(sanText) {
    if (sanText === "O-O") return "castles kingside";
    if (sanText === "O-O-O") return "castles queenside";
    let t = sanText, suffix = "", promo = "";
    if (t.endsWith("#")) { suffix = ", checkmate"; t = t.slice(0, -1); }
    else if (t.endsWith("+")) { suffix = ", check"; t = t.slice(0, -1); }
    const pm = t.match(/=([QRBN])$/);
    if (pm) { promo = ", promoting to " + PIECE_SAID[pm[1]].toLowerCase(); t = t.slice(0, -2); }
    let out = "";
    if (PIECE_SAID[t[0]]) { out = PIECE_SAID[t[0]] + " "; t = t.slice(1); }
    out += t.replace("x", "\u0001")                    // park it: "takes" has a-h letters of its own
            .replace(/[a-h]/g, c => c.toUpperCase())
            .replace(/([A-H])(?=[A-H])/g, "$1 ")
            .replace(/([A-H])(\d)/g, "$1 $2")
            .replace(/(\d)(?=[A-H])/g, "$1 ")
            .replace("\u0001", " takes ");
    return (out + promo + suffix).replace(/\s+/g, " ").trim();
  }

  function animateMove(state, m, onDone) {
    const size = boardEl.clientWidth ? boardEl.clientWidth / 8 : 0;
    if (!size || reducedMotion()) { onDone(); return; }
    const piece = m.piece;
    const fly = document.createElement("div");
    fly.className = `flyer piece ${colorOf(piece)}`;
    fly.textContent = GLYPH[piece.toLowerCase()];
    fly.style.width = fly.style.height = size + "px";
    fly.style.left = (file(m.from) * size) + "px";
    fly.style.top = (rank(m.from) * size) + "px";
    boardEl.appendChild(fly);
    squares[m.from].innerHTML = "";           // the piece is in flight, not at home
    raf(() => {
      fly.style.transform = `translate(${(file(m.to) - file(m.from)) * size}px, ${(rank(m.to) - rank(m.from)) * size}px)`;
    });
    setTimeout(() => { fly.remove(); onDone(); }, 320);
  }
  const animate = (state, m) => new Promise(res => animateMove(state, m, res));

  // With a voice, pacing comes from the sentence being spoken. Without one,
  // the caption is the only channel — so it has to stay up long enough to read.
  const readPause = key => wait(Speech.on && Speech.supported ? (key ? 250 : 150) : (key ? 1600 : 430));

  function caption(text, quiet) {
    const c = el("walk-caption");
    c.innerHTML = text;
    c.classList.toggle("quiet", !!quiet);
    liveEl.textContent = text.replace(/<[^>]+>/g, "");
  }

  function walkNarration(i) {
    const h = ui.history[i];
    const sanText = ui.sans[i];
    const num = Math.floor(i / 2) + 1;
    const mine = ui.vsCpu ? h.s.turn === "w" : true;
    const entry = ui.review && ui.review.entries.find(e => e.ply === i);
    const key = entry && (entry.grade === "blunder" || entry.grade === "mistake" || entry.grade === "inacc");
    if (key) {
      const better = san(h.s, entry.bestMove, legal(h.s));
      return {
        key: true, entry,
        text: `<b>${num}${h.s.turn === "w" ? "." : "..."} ${sanText}</b> — ${GRADE_LABEL[entry.grade].toLowerCase()}. `
            + `${entry.why ? entry.why + " " : ""}<b>${better}</b> was better.`,
        speech: `Move ${num}. ${mine ? "You played" : "Your opponent played"} ${spell(sanText)}. That is ${
          entry.grade === "blunder" ? "a blunder" : entry.grade === "mistake" ? "a mistake" : "an inaccuracy"}. `
            + `${entry.why ? entry.why.replace(/<[^>]+>/g, "") + " " : ""}Better was ${spell(better)}.`
      };
    }
    return { key: false, entry, text: `${num}${h.s.turn === "w" ? "." : "..."} ${sanText}`, speech: null };
  }

  async function walkStep() {
    const i = ui.walk.idx;
    if (i >= ui.history.length) return endWalk();
    const h = ui.history[i];
    const n = walkNarration(i);

    // Show the position as it stood before the move, marked when it matters.
    ui.viewState = h.s;
    ui.viewMarks = n.key ? { bad: [h.m.from, h.m.to], good: [n.entry.bestMove.from, n.entry.bestMove.to] } : null;
    caption(n.text, !n.key);
    el("walk-pos").textContent = `${i + 1} / ${ui.history.length}`;
    render();

    // A mistake is worth stopping for; an ordinary move is not.
    if (n.key) { await Speech.say(n.speech); if (!ui.walk) return; await readPause(true); }
    if (!ui.walk) return;

    ui.viewMarks = null;
    render();
    await animate(h.s, h.m);
    if (!ui.walk) return;

    ui.viewState = make(h.s, h.m);
    ui.last = { from: h.m.from, to: h.m.to };
    render();
    if (h.m.captured) Sound.capture(); else if (h.m.castle) Sound.castle(); else Sound.move();
    ui.walk.idx = i + 1;
    await readPause(n.key);
  }

  async function walkLoop() {
    while (ui.walk && ui.walk.playing && ui.walk.idx < ui.history.length) await walkStep();
    if (ui.walk && ui.walk.idx >= ui.history.length) endWalk();
  }

  async function startWalk() {
    if (!ui.review) return;
    ui.walk = { idx: 0, playing: true };
    el("walk").classList.add("show");
    el("walk-start").style.display = "none";
    el("review-exit").style.display = "none";
    el("walk-play").textContent = "Pause";
    syncVoice(Speech.on);
    const mine = ui.review.entries.filter(e => ui.vsCpu ? e.side === "w" : true);
    const acc = mine.length ? (mine.reduce((a, e) => a + e.accuracy, 0) / mine.length) : 100;
    const bad = mine.filter(e => e.grade === "blunder" || e.grade === "mistake").length;
    caption(`<b>Let's go through the game.</b> ${bad ? `${bad} move${bad > 1 ? "s" : ""} cost you most of it — I'll stop at each one.` : "Nothing went badly wrong; I'll point out the small things."}`);
    await Speech.say(`Let's go through the game. Your accuracy was ${Math.round(acc)} out of 100. ${
      bad ? `${bad} move${bad > 1 ? "s" : ""} cost you most of it. I will stop at each one.` : "Nothing went badly wrong."}`);
    if (!ui.walk) return;
    await readPause(true);          // the opening line must be readable with no voice
    if (!ui.walk) return;
    walkLoop();
  }

  function endWalk() {
    if (!ui.walk) return;
    ui.walk = null;
    Speech.stop();
    ui.viewState = null; ui.viewMarks = null;
    el("walk").classList.remove("show");
    el("walk-start").style.display = "";
    el("walk-start").textContent = "Walk me through it again";
    caption("");
    render();
  }

  el("walk-start").addEventListener("click", startWalk);
  el("walk-play").addEventListener("click", () => {
    if (!ui.walk) return;
    ui.walk.playing = !ui.walk.playing;
    el("walk-play").textContent = ui.walk.playing ? "Pause" : "Play";
    Speech.stop();
    if (ui.walk.playing) walkLoop();
  });
  el("walk-next").addEventListener("click", async () => {
    if (!ui.walk) return;
    ui.walk.playing = false;
    el("walk-play").textContent = "Play";
    Speech.stop();
    await walkStep();
  });
  el("walk-exit").addEventListener("click", endWalk);

  const voiceBtn = el("walk-voice");
  function syncVoice(on) {
    voiceBtn.setAttribute("aria-pressed", String(on));
    voiceBtn.setAttribute("aria-label", on ? "Narration on" : "Narration off");
    voiceBtn.style.display = Speech.supported ? "" : "none";   // no voice, no switch
  }
  voiceBtn.addEventListener("click", () => syncVoice(Speech.toggle()));

  // Postel's, the recovery half: a take-back, not a confirm dialog. Against
  // the computer it rewinds the pair, which is what a player means by it.
  undoBtn.addEventListener("click", () => {
    if (!ui.history.length || ui.busy) return;
    Sound.back();
    let prev = ui.history.pop(); ui.sans.pop();
    if (ui.vsCpu && ui.s.turn === "w" && ui.history.length) { prev = ui.history.pop(); ui.sans.pop(); }
    ui.s = prev.s; ui.last = prev.last;
    ui.sel = null; ui.targets = []; ui.over = null; ui.pendingPromo = null;
    promoEl.classList.remove("show");
    render();
  });

  function newGame() {
    Object.assign(ui, { s: initial(), sel:null, targets:[], history:[], sans:[], last:null, busy:false,
                        over:null, pendingPromo:null, reviewing:false, review:null, viewState:null, viewMarks:null, walk:null });
    Speech.stop();
    el("walk").classList.remove("show");
    el("walk-start").style.display = "none";
    promoEl.classList.remove("show");
    el("review-panel").classList.remove("show");
    el("review-bar").style.display = "";
    el("review-fill").style.width = "0";
    el("review-exit").style.display = "none";
    render();
  }
  restartBtn.addEventListener("click", newGame);

  const setMode = cpu => {
    if (ui.vsCpu === cpu) return;
    ui.vsCpu = cpu;
    el("mode-cpu").setAttribute("aria-pressed", String(cpu));
    el("mode-two").setAttribute("aria-pressed", String(!cpu));
    newGame();
  };
  el("mode-cpu").addEventListener("click", () => setMode(true));
  el("mode-two").addEventListener("click", () => setMode(false));

  const setDiff = strong => {
    ui.depth = strong ? 3 : 2;
    el("diff-casual").setAttribute("aria-pressed", String(!strong));
    el("diff-strong").setAttribute("aria-pressed", String(strong));
  };
  el("diff-casual").addEventListener("click", () => setDiff(false));
  el("diff-strong").addEventListener("click", () => setDiff(true));

  const soundBtn = el("sound");
  const syncSound = on => {
    soundBtn.setAttribute("aria-pressed", String(on));
    soundBtn.setAttribute("aria-label", on ? "Sound on" : "Sound off");
  };
  syncSound(Sound.on);
  soundBtn.addEventListener("click", () => syncSound(Sound.toggle()));

  boardEl.addEventListener("keydown", e => {
    const i = Number(document.activeElement?.dataset.i);
    if (Number.isNaN(i)) return;
    const d = { ArrowRight:1, ArrowLeft:-1, ArrowDown:8, ArrowUp:-8 }[e.key];
    if (!d) return;
    e.preventDefault();
    const next = i + d;
    if (next < 0 || next > 63) return;
    if (Math.abs(d) === 1 && rank(next) !== rank(i)) return;
    squares[next].focus();
  });

  render();
  window.__chess = { initial, pseudo, legal, make, san, attacked, kingSq, bestMove, inCheck };
})();
</script>
</body>
</html>
